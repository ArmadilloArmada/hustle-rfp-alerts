# Copy to config.yaml and tune for your niche.
niche: WordPress / small-business web freelancers
max_items: 40

# Prefer concrete niche phrases over ultra-generic tokens (html/css/cms) that
# create false positives from boilerplate job HTML.
keywords:
  - wordpress
  - woocommerce
  - wordpress developer
  - woocommerce developer
  - managed wordpress
  - wordpress migration
  - website redesign
  - website development
  - website maintenance
  - website migration
  - website build
  - custom website
  - business website
  - small business website
  - ecommerce website
  - web development
  - web design
  - freelance web
  - elementor
  - gutenberg
  - squarespace
  - webflow
  - shopify
  - landing page
  - digital presence

# Optional soft signals for fit scoring (not hard filters)
location_hints:
  - remote
  - united states
  - us
  - usa
  - worldwide
  - anywhere

# Prefer official RSS / public APIs. No ToS-breaking scrapers.
feeds:
  # Official Federal Register RSS (no API key). Keyword filter still applied locally.
  - name: Federal Register — information technology services
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=information+technology+services"
    type: rss

  - name: Federal Register — website / web development notices
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=website+development+OR+web+design"
    type: rss

  - name: Federal Register — digital / web presence
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=website+redesign+OR+web+content+management"
    type: rss

  - name: We Work Remotely — Programming
    url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"
    type: rss

  - name: We Work Remotely — Design
    url: "https://weworkremotely.com/categories/remote-design-jobs.rss"
    type: rss

  - name: Remotive — Software Development
    url: "https://remotive.com/api/remote-jobs?category=software-dev"
    type: remotive

  - name: Remotive — Design
    url: "https://remotive.com/api/remote-jobs?category=design"
    type: remotive

  - name: RemoteOK
    url: "https://remoteok.com/api"
    type: remoteok

  # Jobicy public JSON API (no key) — strong WordPress / SMB web signal
  - name: Jobicy — WordPress tag
    url: "https://jobicy.com/api/v2/remote-jobs?count=50&tag=wordpress"
    type: jobicy

  - name: Jobicy — Design tag
    url: "https://jobicy.com/api/v2/remote-jobs?count=50&tag=design"
    type: jobicy

# Optional: set OPENAI_API_KEY for LLM summaries; otherwise templates are used.
openai:
  model: gpt-4o-mini
  max_tokens: 220

# Export / send path (human-approve required; never auto-sends).
# Optional: set BUTTONDOWN_API_KEY to create a Buttondown *draft* on export.
export:
  mailto_to: ""  # optional default for: python -m src export … --mailto-to
